plugins { id 'net.fabricmc.fabric-loom' version '1.17.20' }
repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' } }
configurations { clingingCompat }
loom {
    splitEnvironmentSourceSets()
    mods { alchemical_leather { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'alchemical_leather-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
        clearRunDirectory = false
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.159.0+26.2'
    clingingCompat 'maven.modrinth:gravity-changer-unofficial-port:vpktEkWn'
    clingingCompat 'maven.modrinth:alexs-mobs-continued:fL9nXI68'
    clingingCompat 'maven.modrinth:codxlib:BwANM3tR'
    clingingCompat 'maven.modrinth:cloth-config:Nv3xnWXd'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaExec).configureEach {
    if (providers.gradleProperty('compatMods').isPresent()) {
        systemProperty 'fabric.addMods', file(providers.gradleProperty('compatMods').get()).absolutePath
        systemProperty 'alchemical.compatRequired', providers.gradleProperty('compatProfile').orElse('full').get()
    }
}
tasks.register('prepareClingingCompat', Sync) {
    from configurations.clingingCompat
    into layout.buildDirectory.dir('clingingCompat')
}

jar { from('LICENSE') { rename { "${it}_alchemical-leather" } } }
