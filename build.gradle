import groovy.json.JsonSlurper

plugins { id 'net.fabricmc.fabric-loom' version '1.17.20' }
repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' } }
configurations { clingingCompat }
loom {
    splitEnvironmentSourceSets()
    mods { alchemical_leather { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'alchemical_leather-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
        clearRunDirectory = false
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.159.0+26.2'

    // Exact potion/effect contributors and runtime dependencies from VanillaPlus-26.2.
    clingingCompat 'maven.modrinth:Ga4QXUXC:HuSyysEm'
    clingingCompat 'maven.modrinth:uinQkPFd:fn3HnOIt'
    clingingCompat 'maven.modrinth:xsyTjFDs:I5dH2wW6'
    clingingCompat 'maven.modrinth:9s6osm5g:Ie0AMlex'
    clingingCompat 'maven.modrinth:oFcZaJUN:OmAV9ct6'
    clingingCompat 'maven.modrinth:POQ2i9zu:rJBCX3gG'
    clingingCompat 'maven.modrinth:G1hIVOrD:SmfwDCLg'
    clingingCompat 'maven.modrinth:AtHRJSUW:TVkz6cZh'
    clingingCompat 'maven.modrinth:9KawNmQc:Ak4sHFuc'
    clingingCompat 'maven.modrinth:nHr26oc2:GteyPhns'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaExec).configureEach {
    if (providers.gradleProperty('compatMods').isPresent()) {
        systemProperty 'fabric.addMods', file(providers.gradleProperty('compatMods').get()).absolutePath
        systemProperty 'alchemical.compatRequired', providers.gradleProperty('compatProfile').orElse('full').get()
    }
}
tasks.register('verifyGameTestEntrypoints') {
    inputs.dir('src/gametest/java')
    inputs.file('src/gametest/resources/fabric.mod.json')
    doLast {
        def descriptor = new JsonSlurper().parse(file('src/gametest/resources/fabric.mod.json'))
        def registered = ((descriptor.entrypoints['fabric-gametest'] ?: []) as Set)
        def discovered = fileTree('src/gametest/java').matching { include '**/*.java' }.findAll { file ->
            file.getText('UTF-8').contains('@GameTest')
        }.collect { file ->
            def text = file.getText('UTF-8')
            def packageMatcher = text =~ /(?m)^\s*package\s+([\w.]+)\s*;/
            def classMatcher = text =~ /(?m)^\s*public\s+(?:final\s+)?class\s+(\w+)/
            if(!packageMatcher.find() || !classMatcher.find())throw new GradleException("Cannot derive GameTest class name from ${file}")
            "${packageMatcher.group(1)}.${classMatcher.group(1)}"
        } as Set
        def missing = discovered - registered
        def stale = registered - discovered
        if(!missing.isEmpty() || !stale.isEmpty())throw new GradleException("fabric-gametest entrypoints out of sync. Missing: ${missing}; stale: ${stale}")
    }
}
tasks.named('check') { dependsOn tasks.named('verifyGameTestEntrypoints') }
tasks.register('prepareClingingCompat', Sync) {
    from configurations.clingingCompat
    into layout.buildDirectory.dir('clingingCompat')
}

jar { from('LICENSE') { rename { "${it}_alchemical-leather" } } }
