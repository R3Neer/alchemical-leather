name: Publish alpha.4 prerelease

on:
  push:
    branches:
      - chatgpt/publish-0.1.0-alpha.4

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 135ddf1ce96eb5983d938f7319b6e40a1036659a
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: chmod +x gradlew
      - name: Build release JAR
        run: ./gradlew build -x runClientGameTest --console=plain
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 135ddf1ce96eb5983d938f7319b6e40a1036659a
        run: |
          set -euo pipefail
          JAR="build/libs/alchemical-leather-0.1.0-alpha.4.jar"
          test -f "$JAR"
          if gh release view v0.1.0-alpha.4 --repo R3Neer/alchemical-leather >/dev/null 2>&1; then
            echo "Release v0.1.0-alpha.4 already exists; refusing to replace it." >&2
            exit 1
          fi
          SHA256="$(sha256sum "$JAR" | awk '{print $1}')"
          cat > release-notes.md <<EOF
          Fourth public alpha for Minecraft 26.2 Fabric. Potion-cauldron interactions are now more natural, live tinting updates correctly, and the test harness guarantees that the full server GameTest suite is actually registered.

          Highlights:
          - Normal, splash and lingering potions now pour into Alchemical Leather cauldrons with ordinary Use; splash and lingering bottles no longer require crouching.
          - Potion cauldrons can be tinted with standard dyes while preserving potion identity, effects, custom name, bottle type and dose count.
          - Matching potion refills remain compatible with tinted cauldrons and preserve the stored tint.
          - Live potion and dyed-water tint changes now update visibly immediately without requiring a chunk or world reload.
          - CI enforces GameTest registration consistency and passes 69/69 required server GameTests standalone and 69/69 with the real Clinging Reoriented + Scale Brews + BedrockIfy + Alex's Mobs fixture.
          - BedrockIfy's intentional crafting-dye revocation remains respected while its cauldron feature is active.

          This is an alpha; back up worlds before updating.

          Target commit: \`$TARGET_SHA\`
          SHA-256: \`$SHA256\`
          EOF

          gh release create v0.1.0-alpha.4 \
            --repo R3Neer/alchemical-leather \
            --target "$TARGET_SHA" \
            --title "Alchemical Leather 0.1.0-alpha.4" \
            --prerelease \
            --notes-file release-notes.md \
            "$JAR"
