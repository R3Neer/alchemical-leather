name: Finalize alpha.5 validation

on:
  push:
    branches:
      - chatgpt/finalize-0.1.0-alpha.5-validation

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/finalize-0.1.0-alpha.5-validation
          fetch-depth: 0
      - name: Record final release-prep evidence
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/validation.md')
          text = p.read_text()
          old = "The functional change merged through PR `#7` as main commit `ef89645fd394911eafb6553f82debf1c1e677190`; post-merge run `34750022598` completed successfully. The alpha.5 release-preparation head `71e00b9eed616978fd440bd1d703987449c376e4` then passed both push run `34750487121` and independent pull-request run `34750496727`. The final tag is intentionally withheld until a documentation-complete commit on `main` passes this same pipeline; that exact target and run are recorded below before publication."
          new = "The functional change merged through PR `#7` as main commit `ef89645fd394911eafb6553f82debf1c1e677190`; post-merge run `34750022598` completed successfully. Release-preparation PR `#8` then updated the project version plus README, player guide, architecture and validation documentation. Its documentation-complete head `ba2fdec76e3bc0fca04e41d1f3a3831f6e3afa08` passed push run `34751065423` and independent pull-request run `34751066795`; PR `#8` merged to `main` as `a4719d97633a42d928e41322e0885a8036132367`, whose post-merge run `34751277422` also passed the full pipeline. The final release-documentation merge is validated on `main` before tagging, and the published release notes identify the exact tagged commit and JAR checksum."
          if old not in text:
              raise SystemExit('Expected alpha.5 candidate paragraph not found')
          p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/tmp-finalize-alpha5-validation.yml').unlink()
      - name: Commit final validation evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation.md .github/workflows/tmp-finalize-alpha5-validation.yml
          git commit -m "docs: record alpha.5 release-prep validation"
          git push origin HEAD:chatgpt/finalize-0.1.0-alpha.5-validation
