name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: chmod +x gradlew
      - run: ./gradlew build -x runClientGameTest --console=plain
      - run: xvfb-run -a ./gradlew runClientGameTest --console=plain
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Prepare real compatibility fixture
        run: |
          ./gradlew prepareClingingCompat --console=plain
          curl --fail --location \
            --output build/clingingCompat/clinging-reoriented-0.1.0-alpha.6.jar \
            https://github.com/R3Neer/clinging-reoriented/releases/download/v0.1.0-alpha.6/clinging-reoriented-0.1.0-alpha.6.jar
          curl --fail --location \
            --output build/clingingCompat/scalebrews-0.1.0-beta.5.jar \
            https://github.com/R3Neer/scale-brews/releases/download/v0.1.0-beta.5/scalebrews-0.1.0-beta.5.jar
      - name: Run GameTests with real optional mods
        run: ./gradlew runGameTest -PcompatMods="$GITHUB_WORKSPACE/build/clingingCompat" -PcompatProfile=trade --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alchemical-leather-build
          path: |
            build/libs/*.jar
            build/run/*/logs/latest.log
            build/run/clientGameTest/screenshots/*.png
