name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: chmod +x gradlew
      - run: ./gradlew build -x runClientGameTest --console=plain
      - run: xvfb-run -a ./gradlew runClientGameTest --console=plain
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alchemical-leather-build
          path: |
            build/libs/*.jar
            build/run/*/logs/latest.log
            build/run/clientGameTest/screenshots/*.png
