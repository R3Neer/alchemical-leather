name: Publish alpha.3
on:
  push:
    branches: [main]
    paths:
      - '.release/alpha3-trigger'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a5dfe80dedc0f894f1e07783d4a5175ea27455ce
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: chmod +x gradlew
      - name: Build release JAR
        run: ./gradlew jar --console=plain
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="build/libs/alchemical-leather-0.1.0-alpha.3.jar"
          test -f "$JAR"
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          {
            echo 'Third public alpha for Minecraft 26.2 Fabric. High-level Leatherworkers can now sell curated Alchemical Leather equipment without replacing brewing or exploration progression.'
            echo
            echo 'Highlights:'
            echo '- Expert Leatherworkers can offer timed level-I infused leggings or boots.'
            echo '- Master Leatherworkers can offer timed infusions up to level II across humanoid and animal/BODY armor.'
            echo "- Master persistent armor is limited to level I, one use per restock, and always requires 1 Dragon's Breath as a separate second cost."
            echo '- Vanilla Leatherworker trades and two-offer TradeSets remain intact; economy pools are opt-in and separate from general dyeable-armor compatibility.'
            echo '- Reorientation is never sold. Scale Brews level III is never sold, and persistent Growth/Shrinking are capped at level I.'
            echo '- Validation passed: 41/41 standalone server GameTests, client GameTest, and 41/41 with real Clinging Reoriented + Scale Brews + BedrockIfy + Alex’s Mobs compatibility fixture.'
            echo
            echo 'This is an alpha; back up worlds before updating.'
            echo
            echo 'Target commit: `a5dfe80dedc0f894f1e07783d4a5175ea27455ce`'
            echo "SHA-256: \`$SHA\`"
          } > /tmp/alpha3-notes.md
          gh release create v0.1.0-alpha.3 "$JAR#alchemical-leather-0.1.0-alpha.3.jar" --title 'Alchemical Leather 0.1.0-alpha.3' --notes-file /tmp/alpha3-notes.md --prerelease --target a5dfe80dedc0f894f1e07783d4a5175ea27455ce
