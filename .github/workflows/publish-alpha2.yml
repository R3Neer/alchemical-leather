name: Publish alpha.2

on:
  push:
    branches: [main]
    paths:
      - '.release/alpha2-trigger'

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'chore: trigger alpha.2 release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fd85ebd9b94e5a25b9349ad4530aab6fc98c633e
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build release jar
        run: |
          chmod +x gradlew
          ./gradlew build -x runClientGameTest --console=plain
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR='build/libs/alchemical-leather-0.1.0-alpha.2.jar'
          test -f "$JAR"
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          cat > release-notes.md <<EOF
          Second public alpha for Minecraft 26.2 Fabric. Alchemical Leather now supports genuinely dyeable humanoid and animal armor, adds a native dyed-water cauldron, and keeps BedrockIfy optional. See the README and validation report for mechanics, compatibility, automated coverage, and remaining gameplay QA.

          Highlights:
          - Dyeable armor is discovered through standard wash/dye semantics plus a fallback tag; humanoid slot restrictions remain intact.
          - BODY/animal armor stores one potion bundle and can retain multi-effect potions such as Turtle Master.
          - Native six-level dyed water supports mixing, recoloring and washing without BedrockIfy.
          - BedrockIfy ownership, pre-login player lifecycle and multithreaded cauldron tint rendering are hardened.
          - Validation passed: 32/32 standalone server GameTests, client GameTest, and 32/32 with real Clinging Reoriented 0.1.0-alpha.6 + BedrockIfy 1.11.8+mc26.2.

          This is an alpha; back up worlds before updating.

          Target commit: `fd85ebd9b94e5a25b9349ad4530aab6fc98c633e`
          SHA-256: `$SHA`
          EOF
          gh release create v0.1.0-alpha.2 "$JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --target fd85ebd9b94e5a25b9349ad4530aab6fc98c633e \
            --title 'Alchemical Leather 0.1.0-alpha.2' \
            --notes-file release-notes.md \
            --prerelease
